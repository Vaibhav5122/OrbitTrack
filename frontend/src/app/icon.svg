<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="dishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Orbital Ring Behind -->
  <ellipse cx="32" cy="33" rx="22" ry="9" transform="rotate(-30 32 33)" stroke="url(#orbitGlow)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="75 25" filter="url(#glow)"/>

  <!-- Radar Dish Base -->
  <path d="M22 39 C24 45 40 45 42 39" stroke="url(#dishGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Radar Satellite Dish Arc -->
  <path d="M19 29 C24 41 40 41 45 29" stroke="url(#dishGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Focus Node & Emitter -->
  <line x1="32" y1="36" x2="32" y2="21" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="21" r="3" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="32" cy="21" r="1.5" fill="#ffffff"/>

  <!-- Orbiting Signal Pulse Arrow / Node -->
  <circle cx="48" cy="21" r="2.5" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="48" cy="21" r="1.2" fill="#ffffff"/>
</svg>
